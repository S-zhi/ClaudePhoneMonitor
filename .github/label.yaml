# 仅声明需要同步的标签；同步时保留 GitHub 上已有标签的手工元信息。
- name: "state:needs-triage"
  color: "d73a4a"
  description: "需求待评审：判断需求是否清晰、是否有必要处理"
- name: "state:assess-plan"
  color: "d73a4a"
  description: "制作方案：提出实现方案及验证方式"
- name: "state:coding"
  color: "d73a4a"
  description: "编码实现：修改代码、测试验证并创建或更新关联 PR"
- name: "state:code-review"
  color: "d73a4a"
  description: "代码审查：检查需求与方案符合性、测试、缺陷和风险"
- name: "state:wait-auto-merge"
  color: "d73a4a"
  description: "等待自动合并：跟进检查及合并条件，直至关联 PR 实际合并"
- name: "state:agent-failed"
  color: "d73a4a"
  description: "异常暂停：Agent 执行失败或任务分配超时，暂停自动重试与分配"
- name: "action:human"
  color: "0e8a16"
  description: "当前阶段待办由人处理"
- name: "action:agent"
  color: "0e8a16"
  description: "当前阶段待办由 Agent 处理"
