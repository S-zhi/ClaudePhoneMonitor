name: Action control

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  assign:
    if: startsWith(github.event.label.name, 'state:')
    concurrency:
      group: issue-state-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Review and assign issue action
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/manage_issue_action.py --issue-number "$ISSUE_NUMBER"
