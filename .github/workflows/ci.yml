name: CI
on:
  pull_request:
  push:
    branches: [main, 'dev/magpie']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node-checks:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/protocol/package-lock.json
            services/collector/package-lock.json
            services/relay/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm run ci:install 2>&1 | tee ci-logs/install.log
          python -m pip install -r .github/requirements-ci.txt 2>&1 | tee ci-logs/python-install.log
      - name: Install actionlint 1.7.7
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: ESLint
        run: set -o pipefail; npm run lint 2>&1 | tee ci-logs/lint.log
      - name: TypeScript checks (protocol, collector, relay)
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - name: Shell syntax and workflow validation
        run: |
          set -o pipefail
          npm run check:shell 2>&1 | tee ci-logs/shell.log
          npm run check:workflows 2>&1 | tee ci-logs/workflows.log
      - name: Build backend
        run: set -o pipefail; npm run build 2>&1 | tee ci-logs/build.log
      - name: Node unit tests
        run: set -o pipefail; npm run test:unit 2>&1 | tee ci-logs/unit.log
      - name: Monitor integration tests
        run: set -o pipefail; npm run test:integration 2>&1 | tee ci-logs/integration.log
      - name: Helper shell and Python tests
        run: set -o pipefail; npm run test:helpers 2>&1 | tee ci-logs/helpers.log
      - name: GitHub automation Python tests
        run: set -o pipefail; npm run test:github 2>&1 | tee ci-logs/github.log
      - name: CI lifecycle tests
        run: set -o pipefail; npm run test:ci 2>&1 | tee ci-logs/ci-tests.log
      - name: Live relay contract
        run: set -o pipefail; npm run test:live 2>&1 | tee ci-logs/live.log
      - name: Package backend
        run: set -o pipefail; npm run package:backend 2>&1 | tee ci-logs/package.log
      - name: Package Magpie backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true'
        run: set -o pipefail; npm run package:magpie 2>&1 | tee ci-logs/package-magpie.log
      - name: Upload Node diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-diagnostics-${{ github.sha }}
          path: |
            ci-logs/
            reports/relay-smoke/
          retention-days: 14
      - name: Stage validated backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: validated-backend-${{ github.sha }}
          path: artifacts/backend-${{ github.sha }}.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Stage Magpie backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: magpie-backend-${{ github.sha }}
          path: artifacts/magpie-backend-${{ github.sha }}.tar.gz
          retention-days: 1
          if-no-files-found: error
  android-checks:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Android setup environment
        run: |
          mkdir -p ci-logs
          {
            uname -a
            printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${ANDROID_HOME:-unset}" "${ANDROID_SDK_ROOT:-unset}"
          } 2>&1 | tee ci-logs/android-setup.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: |
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a ci-logs/android-setup.log
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint, unit tests and APK
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon :apps:android:lintDebug :apps:android:testDebugUnitTest :apps:android:assembleDebug 2>&1 | tee ci-logs/android.log
      - name: Check Magpie variant without distribution signing
        if: (github.event_name == 'pull_request' && github.base_ref == 'dev/magpie') || (github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED != 'true')
        run: |
          set -o pipefail
          ./gradlew --no-daemon :apps:android:lintMagpie :apps:android:testMagpieUnitTest :apps:android:assembleMagpie 2>&1 | tee ci-logs/android-magpie-pr.log
      - name: Prepare Magpie signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true'
        env:
          MAGPIE_KEYSTORE_BASE64: ${{ secrets.MAGPIE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAGPIE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$MAGPIE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magpie-release.jks"
      - name: Magpie lint, unit tests and signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true'
        env:
          MAGPIE_KEYSTORE_PATH: ${{ runner.temp }}/magpie-release.jks
          MAGPIE_KEYSTORE_PASSWORD: ${{ secrets.MAGPIE_KEYSTORE_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ secrets.MAGPIE_KEY_ALIAS }}
          MAGPIE_KEY_PASSWORD: ${{ secrets.MAGPIE_KEY_PASSWORD }}
          MAGPIE_REQUIRE_SIGNING: '1'
        run: |
          set -o pipefail
          export MAGPIE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon :apps:android:lintMagpie :apps:android:testMagpieUnitTest :apps:android:assembleMagpie 2>&1 | tee ci-logs/android-magpie.log
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ github.sha }}
          path: |
            ci-logs/
            apps/android/build/reports/
            apps/android/build/test-results/
          retention-days: 14
      - name: Stage validated APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: validated-apk-${{ github.sha }}
          path: apps/android/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Stage signed Magpie APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: magpie-apk-${{ github.sha }}
          path: apps/android/build/outputs/apk/magpie/*.apk
          retention-days: 1
          if-no-files-found: error
  publish-artifacts:
    name: Publish validated artifacts
    needs: [node-checks, android-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-backend-${{ github.sha }}
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: validated-apk-${{ github.sha }}
          path: apk
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: backend/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 14
  publish-magpie:
    name: Publish Magpie development build
    needs: [node-checks, android-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/magpie' && vars.MAGPIE_PUBLISH_ENABLED == 'true' && needs.node-checks.result == 'success' && needs.android-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: magpie-backend-${{ github.sha }}
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: magpie-apk-${{ github.sha }}
          path: apk
      - name: Publish source-pinned Magpie prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAGPIE_PUBLISH_ENABLED: ${{ vars.MAGPIE_PUBLISH_ENABLED }}
          NODE_CHECKS_RESULT: ${{ needs.node-checks.result }}
          ANDROID_CHECKS_RESULT: ${{ needs.android-checks.result }}
        run: node scripts/ci/publish-magpie.mjs
